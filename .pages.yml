media:
  - name: documents
    label: Documentos PDF
    input: assets/documents
    output: /assets/documents
    extensions: [pdf]
    rename: safe
content:
  - name: publications
    label: Publicaciones
    type: file
    path: _data/publications.json
    format: json
    fields:
      - name: items
        label: Lista de publicaciones
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{year} — {citation}"
        fields:
          - name: year
            label: Año de publicación
            type: number
            required: true
            options:
              min: 1900
              max: 2100
          - name: citation
            label: Referencia completa (autores, título, revista y DOI)
            type: rich-text
            required: true
            description: "Pega la referencia sin número inicial. Puedes poner tu nombre en negrita. La numeración y la agrupación por año son automáticas."
            options:
              format: markdown
              switcher: false
              media: false
          - name: url
            label: Enlace al artículo
            type: string
            description: "Enlace completo, por ejemplo https://doi.org/10..."
  - name: profile
    label: Biografía y hoja de vida
    type: file
    path: _data/profile.json
    format: json
    fields:
      - name: bio_en
        label: Biografía en inglés (página principal)
        type: text
        required: true
      - name: bio_es
        label: Biografía en español (página principal)
        type: text
        required: true
      - name: cv
        label: Hoja de vida en PDF
        type: file
        required: true
        options:
          media: documents
          extensions: [pdf]
